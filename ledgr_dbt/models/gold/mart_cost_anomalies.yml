version: 2

models:
  - name: mart_cost_anomalies
    description: >
      Daily cost-per-successful-outcome by model, with a 7-day rolling 
      baseline (mean +/- 2 stddev) used to flag anomalies. Baseline 
      statistical demonstration, not production-grade, dataset spans 
      only 21 distinct days. Rows with fewer than 3 prior days in the 
      window are flagged baseline_unreliable and never marked as anomalies.
    columns:
      - name: model_request
        tests:
          - not_null
      - name: call_date
        tests:
          - not_null
    tests:
      - dbt_utils.expression_is_true:
          expression: "daily_successful_calls >= 0"
      - dbt_utils.expression_is_true:
          expression: "NOT (baseline_unreliable = true AND is_anomaly = true)"
      - dbt_utils.expression_is_true:
          expression: "NOT (rolling_7day_stddev IS NULL AND is_anomaly = true)"
